<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="animeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="animeHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="animeSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49774"/>
      <stop offset="100%" stop-color="#b47854"/>
    </linearGradient>
    <linearGradient id="animeSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="animeGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Anime Background -->
  <rect width="400" height="480" rx="24" fill="url(#animeBg)"/>
  <rect width="400" height="480" rx="24" fill="url(#animeGlow)"/>

  <!-- Geometric Tech Lines in Anime BG -->
  <line x1="40" y1="80" x2="120" y2="80" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="280" y1="400" x2="360" y2="400" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="340" cy="90" r="18" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <circle cx="60" cy="380" r="14" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>

  <!-- Anime Suit & Shoulders -->
  <g>
    <path d="M60 480 C60 360 110 320 140 300 L260 300 C290 320 340 360 340 480 Z" fill="url(#animeSuit)" stroke="#6366f1" stroke-width="1.5"/>
    <!-- Anime Collar & Lapels -->
    <polygon points="175 300, 200 370, 150 300" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <polygon points="225 300, 200 370, 250 300" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <!-- Violet Cyber Tie -->
    <polygon points="194 320, 206 320, 209 430, 200 450, 191 430" fill="#7c3aed" filter="url(#bloom)"/>
    <!-- Lapels with Neon Rim -->
    <path d="M140 300 L185 410 L160 480 L100 480 C90 420 110 340 140 300 Z" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M260 300 L215 410 L240 480 L300 480 C310 420 290 340 260 300 Z" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  </g>

  <!-- Neck -->
  <polygon points="180 230, 220 230, 215 310, 185 310" fill="url(#animeSkin)"/>
  <polygon points="180 230, 220 230, 210 265, 190 265" fill="#a06442" opacity="0.5"/>

  <!-- Anime Face Shape -->
  <path d="M145 140 C145 90 255 90 255 140 C255 190 230 248 200 255 C170 248 145 190 145 140 Z" fill="url(#animeSkin)" stroke="#8c4e2f" stroke-width="1.5"/>

  <!-- Anime Eyes -->
  <g>
    <!-- Left Eye -->
    <path d="M162 160 Q174 153 186 160" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="174" cy="168" rx="8" ry="10" fill="#1e1b4b"/>
    <ellipse cx="174" cy="170" rx="6" ry="7" fill="#6366f1"/>
    <circle cx="172" cy="165" r="3" fill="#ffffff"/>
    <circle cx="177" cy="172" r="1.5" fill="#c4b5fd"/>
    
    <!-- Right Eye -->
    <path d="M214 160 Q226 153 238 160" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="226" cy="168" rx="8" ry="10" fill="#1e1b4b"/>
    <ellipse cx="226" cy="170" rx="6" ry="7" fill="#6366f1"/>
    <circle cx="224" cy="165" r="3" fill="#ffffff"/>
    <circle cx="229" cy="172" r="1.5" fill="#c4b5fd"/>

    <!-- Anime Nose & Mouth -->
    <path d="M200 188 L198 196 L202 196" stroke="#8c4e2f" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M186 215 Q200 226 214 215" stroke="#783d21" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="158" cy="186" r="8" fill="#ec4899" opacity="0.25" filter="blur(4px)"/>
    <circle cx="242" cy="186" r="8" fill="#ec4899" opacity="0.25" filter="blur(4px)"/>
  </g>

  <!-- Stylized Anime Hair (Layered Spikes & Flow) -->
  <g filter="url(#bloom)">
    <path d="M130 145 C125 90 150 50 200 50 C250 50 275 90 270 145 
             L255 125 L245 140 L230 115 L215 138 L200 110 L185 138 L170 115 L155 140 L145 125 Z" 
          fill="url(#animeHair)" stroke="#4338ca" stroke-width="1.5"/>
    <!-- Anime Hair Highlights -->
    <path d="M150 90 Q200 70 250 90" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M160 100 Q200 85 240 100" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- Tag / Status Overlay -->
  <g transform="translate(24, 24)">
    <rect width="134" height="28" rx="14" fill="#2e1065" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#a855f7" filter="url(#bloom)"/>
    <text x="26" y="18" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Illustrated Avatar</text>
  </g>

  <g transform="translate(280, 24)">
    <rect width="96" height="28" rx="14" fill="#090d16" fill-opacity="0.7" stroke="#6366f1" stroke-width="1"/>
    <text x="48" y="18" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Tap to Flip ↺</text>
  </g>
</svg>